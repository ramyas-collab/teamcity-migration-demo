name: Build

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm test

      - run: |
          mkdir dist
          cp index.js dist/

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist
      - name: Read Secret
        run: echo "Secret exists"

        env:
          PASSWORD: ${{ secrets.DEV_PASSWORD }}     
